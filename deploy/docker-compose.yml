services:
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    environment:
      TZ: ${TZ}
    volumes:
      - ./grocy:/config
    ports:
      - "9283:80"   # LAN only, for the Home Assistant Grocy integration
    restart: unless-stopped

  mealplanner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      GROCY_URL: http://grocy/api
      TZ: ${TZ}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"   # LAN only, for HA polling /api/expiring; users go through `tailscale serve` (HTTPS)
    depends_on:
      - grocy
    restart: unless-stopped
