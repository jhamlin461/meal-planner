services:
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    environment:
      TZ: ${TZ}
    volumes:
      - ./grocy:/config
    ports:
      - "9283:80"   # LAN only, for the Home Assistant Grocy integration
    restart: unless-stopped

  mealplanner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      GROCY_URL: http://grocy/api
      TZ: ${TZ}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"   # this box only: everyone (HA's sidebar too) goes through `tailscale serve` (HTTPS)
    depends_on:
      - grocy
    restart: unless-stopped
