# Merge into Home Assistant's automations. Replace <phone1>/<phone2> with your notify service names
# (Developer Tools -> Actions, search "notify.mobile_app_").
- alias: Meal planner expiring food
  trigger:
    - platform: time
      at: "08:00:00"
  condition:
    - condition: numeric_state
      entity_id: sensor.meal_planner_expiring
      above: 0
  action:
    - service: notify.mobile_app_<phone1>
      data:
        title: Food expiring
        message: "{{ state_attr('sensor.meal_planner_expiring', 'message') }}"
    - service: notify.mobile_app_<phone2>
      data:
        title: Food expiring
        message: "{{ state_attr('sensor.meal_planner_expiring', 'message') }}"
