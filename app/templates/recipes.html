{% extends "base.html" %}
{% block title %}Recipes{% endblock %}
{% block content %}
<h1>Recipes</h1>
<p class="row"><a class="button" href="/import">Import recipes</a>{% if waiting %}<a href="/import">{{ waiting }} waiting for review</a>{% endif %}</p>
<ul class="rows">
{% for r in recipes %}<li><a href="/recipes/{{ r.id }}">{{ r.name }}</a></li>
{% else %}<li class="muted">No recipes yet.</li>
{% endfor %}</ul>
{% endblock %}
