{# `cross` (optional, a storage key): ingredient and step cells become toggles for crossing off while cooking (app.js) #}
<div class="cfe-wrap" role="region" aria-label="Recipe table" tabindex="0"{% if cross %} data-cross-key="{{ cross }}"{% endif %}>
<table class="cfe">
{% for line in pre %}<tr><td class="cfe-pre" colspan="{{ ncols }}">{{ line }}</td></tr>
{% endfor %}{% for row in grid %}<tr>{% for c in row %}<td class="cfe-{{ c.kind }}" rowspan="{{ c.rowspan }}" colspan="{{ c.colspan }}"
{%- if cross and c.ref %} data-cross="{{ c.ref }}" role="button" tabindex="0" aria-pressed="false"{% endif %}>{{ c.text }}
{%- if c.where %}<span class="cfe-where">{{ c.where }}</span>{% endif %}</td>{% endfor %}</tr>
{% endfor %}</table>
</div>
