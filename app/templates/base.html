<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2e7d32">
<title>{% block title %}Meals{% endblock %}</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
</head>
<body>
<main{% block main_attrs %}{% endblock %}>
{% block content %}{% endblock %}
</main>
<nav class="bottom">
{% for href, label in [("/plan", "Plan"), ("/pantry", "Pantry"), ("/scan", "Scan"), ("/recipes", "Recipes"), ("/shopping", "Shopping")] %}<a href="{{ href }}"{% if request.url.path.startswith(href) %} aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}
</nav>
<div id="toast" role="status" hidden></div>
{% block scripts %}{% endblock %}
<script src="/static/app.js" defer></script>
</body>
</html>
