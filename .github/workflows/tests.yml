name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"   # same as deploy/Dockerfile
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest -q
